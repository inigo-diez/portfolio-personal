# Deploy to GitHub Pages. Iñigo activates it: repo Settings → Pages → Source: "GitHub Actions",
# then run it from the Actions tab. Manual trigger only for now; add `push: branches: [main]` when ready.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# Least privilege: the build only reads; only the deploy job can write to Pages (and get the OIDC token).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
