<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--app-head--><title>Iñigo Díez Osúa</title>
    <meta name="description" content="" /><!--/app-head-->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- welcome screen (src/app/Welcome.tsx): when the session starts on the home, white from the first paint
         until it takes over (and never longer than 8 s, should the script not load) -->
    <style>
      html.welcome-pending body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        background: #fff;
      }
    </style>
    <!-- Phones show the desktop version, scaled down to the screen (Iñigo, 2026-10-25): the page is laid out at
         1024 px wide (above the 860 px breakpoint of the phone layout) and the browser fits it to the screen;
         pinch zoom stays on. Only phones: the short side of the screen under 600 px, so tablets keep theirs. -->
    <script>
      try {
        if (Math.min(screen.width, screen.height) < 600)
          document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1024');
      } catch (e) {}
    </script>
    <script>
      try {
        if (location.pathname === '%BASE_URL%' && !sessionStorage.getItem('ido-welcome')) {
          document.documentElement.classList.add('welcome-pending');
          setTimeout(function () {
            document.documentElement.classList.remove('welcome-pending');
          }, 8000);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
