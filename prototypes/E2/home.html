<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iñigo Díez Osúa · Pocket OS (E2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="device.css">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  .skip { position: absolute; left: 16px; top: -40px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; z-index: 5; }
  .skip:focus { top: 12px; }
  :where(a, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  header { display: flex; justify-content: flex-end; padding: 28px 40px 0; }
  nav ul { list-style: none; display: flex; gap: 24px; margin: 0; padding: 0; font-size: 13px; }
  nav a { color: var(--ink-2); transition: color .15s; }
  nav a:hover { color: var(--ink); }

  main {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    column-gap: clamp(48px, 9vw, 160px); padding: 0 40px 9svh;
  }
  .intro { justify-self: end; display: flex; align-items: center; gap: 8px; }
  .intro h1 { margin: 0; font-size: 21px; font-weight: 500; letter-spacing: -.025em; white-space: nowrap; }
  .info {
    width: 18px; height: 18px; border-radius: 50%; border: 1.3px solid currentColor; background: none; padding: 0;
    color: var(--ink-2); font: 600 10.5px/1 var(--font-sans); cursor: pointer; display: grid; place-items: center;
  }
  .info:hover { color: var(--ink); }

  .stage { position: relative; display: grid; justify-items: center; }
  #device { --w: clamp(300px, min(29vw, 46svh), 430px); }  /* body is 100 × 124 */
  .keys-hint {
    position: absolute; top: calc(100% + 18px); font-size: 12px; color: var(--ink-2); white-space: nowrap;
    opacity: 0; transition: opacity .2s;
  }
  .stage:focus-within .keys-hint { opacity: 1; }
  kbd { font: 500 11px/1 var(--font-sans); border: 1px solid rgba(0,0,0,.14); border-radius: 4px; padding: 2px 5px; margin: 0 2px; color: var(--ink); }

  .cta { justify-self: start; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
    background: var(--ink); color: #fff; font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: background .15s, transform .15s var(--ease-out);
  }
  .pill:hover { background: #000; transform: translateY(-1px); }
  .ghost { border: 0; background: none; padding: 2px 0; font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .ghost:hover { color: var(--ink); }
  .ghost svg { width: 13px; height: 13px; }

  .quick { display: none; }

  @media (max-width: 860px) {
    header { padding: 18px 16px 0; }
    nav { display: none; }
    main { grid-template-columns: 1fr; row-gap: 28px; padding: 24px 16px 40px; justify-items: center; align-content: start; }
    .intro, .cta { justify-self: center; }
    .intro h1 { font-size: 20px; }
    #device { --w: min(calc(100vw - 48px), 360px); }
    .keys-hint { display: none; }
    .cta { flex-direction: row; align-items: center; gap: 20px; margin-top: 44px; }
    .quick { display: block; width: min(calc(100vw - 32px), 420px); }
    .quick ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .quick a { display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid var(--line); font-size: 16px; }
    .quick a span { font-size: 13px; color: var(--ink-2); }
  }
</style>
</head>
<body>
<a class="skip" href="#enlaces">Saltar a los enlaces</a>
<header>
  <nav aria-label="Principal" id="enlaces">
    <ul>
      <li><a href="#" data-open="sobre-mi">Sobre mí</a></li>
      <li><a href="#" data-open="trayectoria">Trayectoria</a></li>
      <li><a href="canvas.html">Proyectos</a></li>
      <li><a href="#" data-open="habilidades">Habilidades</a></li>
      <li><a href="#" data-open="formacion">Formación</a></li>
      <li><a href="#" data-open="contacto">Contacto</a></li>
      <li><a href="#" data-open="cv">CV</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="intro">
    <h1>Hola, soy Iñigo Díez Osúa</h1>
    <button class="info" data-open="sobre-mi" aria-label="Sobre mí">i</button>
  </div>

  <div class="stage">
    <div id="device" data-model="slate"></div>
    <p class="keys-hint"><kbd>↑</kbd><kbd>↓</kbd> moverse · <kbd>→</kbd> abrir · <kbd>←</kbd> volver</p>
  </div>

  <div class="cta">
    <a class="pill" href="canvas.html">Ver proyectos</a>
    <button class="ghost" id="flip" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.5 3.5v3.6h-3.6M5.5 20.5v-3.6h3.6"/></svg>
      <span>Girar</span>
    </button>
  </div>

  <div class="quick">
    <ul>
      <li><a href="#" data-open="sobre-mi">Sobre mí <span>→</span></a></li>
      <li><a href="#" data-open="trayectoria">Trayectoria <span>→</span></a></li>
      <li><a href="canvas.html">Proyectos <span>13</span></a></li>
      <li><a href="#" data-open="habilidades">Habilidades <span>→</span></a></li>
      <li><a href="#" data-open="formacion">Formación <span>→</span></a></li>
      <li><a href="#" data-open="contacto">Contacto <span>→</span></a></li>
      <li><a href="#" data-open="cv">CV <span>PDF</span></a></li>
    </ul>
  </div>
</main>

<script src="device.js"></script>
<script>
  const device = PocketOS.mount(document.getElementById('device'), {
    globalKeys: true, tilt: true, reflect: true,
    onCanvas: () => location.href = 'canvas.html',
  });
  const flipBtn = document.getElementById('flip');
  flipBtn.addEventListener('click', () => {
    const back = device.flip();
    flipBtn.setAttribute('aria-pressed', back);
  });
  document.querySelectorAll('[data-open]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    device.open(a.dataset.open);
    document.getElementById('device').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
</script>
</body>
</html>
